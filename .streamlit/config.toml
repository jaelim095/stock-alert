# The dashboard is localhost-only — it displays account details, so never expose it externally
[server]
address = "localhost"
port = 8501
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#5B5FC7"
backgroundColor = "#FAFBFD"
secondaryBackgroundColor = "#F1F2F8"
textColor = "#1A1D27"
